# Example: nginx terminates TLS and forwards to the bridge (server.tls.mode: proxy,
# server.listen: 127.0.0.1:8080, server.trusted_proxies: [127.0.0.1/32]).
server {
    listen 8443 ssl;
    http2 off;
    server_name bridge.example.co.id;

    ssl_certificate     /etc/ssl/bridge/fullchain.pem;
    ssl_certificate_key /etc/ssl/bridge/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Only the Privasimu servers may connect.
    allow 203.0.113.10;
    deny  all;

    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }
}
